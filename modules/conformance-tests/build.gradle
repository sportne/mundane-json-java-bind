plugins {
    id 'mjjb.java-conventions'
    id 'mjjb.quality-conventions'
    id 'mjjb.coverage-conventions'
}

description = 'Internal JSON Schema subset conformance test harness; not published.'

dependencies {
    testImplementation project(':modules:generator-core')
    testImplementation project(':modules:parser-core')
    testImplementation project(':modules:schema-model')
    testImplementation project(':modules:testing-support')
}

sourceSets {
    schemaStoreCorpusTest {
        compileClasspath += sourceSets.test.output + sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    schemaStoreCorpusTestImplementation.extendsFrom testImplementation
    schemaStoreCorpusTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('performanceEvidence', JavaExec) {
    group = 'verification'
    description = 'Writes repeatable parser and generated-binding performance evidence.'
    mainClass = 'io.github.mundanej.mjjb.conformance.PerformanceEvidence'
    classpath = sourceSets.test.runtimeClasspath
    args layout.buildDirectory.dir('reports/performance').get().asFile.absolutePath,
            layout.buildDirectory.dir('performance-evidence').get().asFile.absolutePath,
            sourceSets.test.runtimeClasspath.asPath
    dependsOn tasks.named('testClasses')
}

tasks.register('schemaStoreCorpusTest', Test) {
    group = 'verification'
    description = 'Runs the explicit SchemaStore sidecar corpus evidence lane.'
    testClassesDirs = sourceSets.schemaStoreCorpusTest.output.classesDirs
    classpath = sourceSets.schemaStoreCorpusTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    systemProperty 'mjjb.schemaStoreReportDir',
            layout.buildDirectory.dir('reports/schemastore-corpus').get().asFile.absolutePath
    systemProperty 'mjjb.schemaStoreWorkspaceDir',
            layout.buildDirectory.dir('schemastore-corpus').get().asFile.absolutePath
    systemProperty 'mjjb.schemaStoreRefresh',
            providers.gradleProperty('mjjb.schemaStoreRefresh').getOrElse('false')
    if (providers.gradleProperty('mjjb.schemaStoreManifestPath').isPresent()) {
        systemProperty 'mjjb.schemaStoreManifestPath',
                providers.gradleProperty('mjjb.schemaStoreManifestPath').get()
    }
    setFinalizedBy([])
}

tasks.register('schemaStoreCorpus') {
    group = 'verification'
    description = 'Runs the explicit SchemaStore sidecar corpus evidence lane.'
    dependsOn tasks.named('schemaStoreCorpusTest')
}

tasks.register('fuzzTest', Test) {
    group = 'verification'
    description = 'Runs generated-binding deterministic fuzz tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    dependsOn tasks.named('testClasses')
    useJUnitPlatform {
        includeTags 'fuzz'
    }
    systemProperty 'mjjb.fuzz.seed',
            providers.gradleProperty('mjjb.fuzz.seed').getOrElse('3405691582')
    systemProperty 'mjjb.fuzz.iterations',
            providers.gradleProperty('mjjb.fuzz.iterations').getOrElse('24')
    systemProperty 'mjjb.fuzz.maxDepth',
            providers.gradleProperty('mjjb.fuzz.maxDepth').getOrElse('5')
    systemProperty 'mjjb.fuzz.maxStringLength',
            providers.gradleProperty('mjjb.fuzz.maxStringLength').getOrElse('24')
    setFinalizedBy([])
}
