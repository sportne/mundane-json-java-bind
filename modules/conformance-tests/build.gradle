plugins {
    id 'mjjb.java-conventions'
    id 'mjjb.quality-conventions'
    id 'mjjb.coverage-conventions'
}

description = 'Internal JSON Schema subset conformance test harness; not published.'

dependencies {
    testImplementation project(':modules:generator-core')
    testImplementation project(':modules:parser-core')
    testImplementation project(':modules:schema-model')
    testImplementation project(':modules:testing-support')
}

tasks.register('performanceEvidence', JavaExec) {
    group = 'verification'
    description = 'Writes repeatable parser and generated-binding performance evidence.'
    mainClass = 'io.github.mundanej.mjjb.conformance.PerformanceEvidence'
    classpath = sourceSets.test.runtimeClasspath
    args layout.buildDirectory.dir('reports/performance').get().asFile.absolutePath,
            layout.buildDirectory.dir('performance-evidence').get().asFile.absolutePath,
            sourceSets.test.runtimeClasspath.asPath
    dependsOn tasks.named('testClasses')
}
