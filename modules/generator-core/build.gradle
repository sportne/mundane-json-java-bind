plugins {
    id 'mjjb.java-conventions'
    id 'mjjb.quality-conventions'
    id 'mjjb.coverage-conventions'
    id 'mjjb.publishing-conventions'
}

description = 'JSON Schema to Java binding generator implementation.'

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'mjjb-generator-core'
        }
    }
}

sourceSets {
    generatedCodeSmoke {
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

dependencies {
    api project(':modules:generator-api')
    implementation project(':modules:schema-model')
    generatedCodeSmokeImplementation project(':modules:generator-api')
    generatedCodeSmokeImplementation project(':modules:parser-core')
    testImplementation project(':modules:runtime-core')
    testImplementation sourceSets.generatedCodeSmoke.output
}

tasks.register('generatedCodeSmoke', JavaExec) {
    group = 'verification'
    description = 'Compiles and verifies generated Java source fixtures.'
    mainClass = 'io.github.mundanej.mjjb.generator.core.generated.GeneratedCodeSmoke'
    classpath = sourceSets.generatedCodeSmoke.runtimeClasspath
    systemProperty(
            'mjjb.generatedSourceCompileClasspath',
            sourceSets.generatedCodeSmoke.runtimeClasspath.asPath)
    args layout.buildDirectory.dir('generated-code-smoke').get().asFile.absolutePath
    dependsOn tasks.named('generatedCodeSmokeClasses')
}

tasks.named('check') {
    dependsOn tasks.named('generatedCodeSmoke')
}

tasks.register('generatedCodeNativeSmoke') {
    group = 'verification'
    description = 'Placeholder for generated-code Native Image smoke checks.'
    dependsOn tasks.named('test')
}
