name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set release version
        id: release-version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          if [[ -z "${version}" || "${version}" == *"-SNAPSHOT" ]]; then
            echo "Release version must be a non-SNAPSHOT version." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run release dry-run
        run: ./gradlew releaseDryRun -Pmjjb.version=${{ steps.release-version.outputs.version }} --console=plain

      - name: Package Maven repository
        shell: bash
        run: |
          version="${{ steps.release-version.outputs.version }}"
          mkdir -p build/release-assets
          (cd build/release-dry-run && zip -qr "../release-assets/mjjb-${version}-maven-repository.zip" maven)
          (cd build/release-assets && sha256sum "mjjb-${version}-maven-repository.zip" > "mjjb-${version}-maven-repository.zip.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mjjb-${{ steps.release-version.outputs.version }}-maven-repository
          path: |
            build/release-assets/mjjb-${{ steps.release-version.outputs.version }}-maven-repository.zip
            build/release-assets/mjjb-${{ steps.release-version.outputs.version }}-maven-repository.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release-version.outputs.tag }}"
          version="${{ steps.release-version.outputs.version }}"
          notes="GitHub-only release for mundane-json-java-bind ${version}. Maven artifacts are attached as a zipped local Maven repository; no Maven Central publication is performed."
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              "build/release-assets/mjjb-${version}-maven-repository.zip" \
              "build/release-assets/mjjb-${version}-maven-repository.zip.sha256" \
              --clobber
          else
            gh release create "${tag}" \
              "build/release-assets/mjjb-${version}-maven-repository.zip" \
              "build/release-assets/mjjb-${version}-maven-repository.zip.sha256" \
              --title "mundane-json-java-bind ${version}" \
              --notes "${notes}"
          fi
